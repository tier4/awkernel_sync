[package]
name = "awkernel_sync"
version = "0.1.1"
edition = "2021"
build = "build.rs"
description = "no_std synchronization primitives (mutex, rwlock, spinlock, MCS lock) with interrupt guards for the Awkernel operating system."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tier4/awkernel_sync"
readme = "README.md"

[features]
default = []
std = ["dep:parking_lot"]
x86 = ["dep:x86_64"]
x86_mwait = []
aarch64 = []
rv64 = []
rv32 = []
spinlock = []

[dependencies.x86_64]
version = "0.15"
optional = true

[dependencies.parking_lot]
version = "0.12"
optional = true

[dependencies]

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[dev-dependencies]
loom = "0.7"
